[update]
version_check = false
manifest_check = true

[theme]
name = "one-dark"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = [
  "claude",
  "codex",
  "opencode",
]

[ui]
agent_panel_sort = "priority"

[[keys.command]]
key = "prefix+shift+g"
type = "pane"
command = "lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+shift+h"
type = "pane"
command = "gh pr diff | hunk patch"
description = "PR diff in hunk"
